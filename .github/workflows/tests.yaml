name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

  # Verifies the built library on non-Node runtimes: Bun and the Cloudflare
  # Workers runtime (workerd, via Miniflare).
  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test on Node.js
        run: npm run test:smoke

      - name: Smoke test on Bun
        run: bun test/smoke.mjs

      - name: Smoke test on Cloudflare Workers (workerd)
        run: npm run test:workers
